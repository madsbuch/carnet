[package]
name = "carnet"
version = "0.1.0"
description = "Markdown notes on your own files, with wiki links and a graph"
authors = ["Mads Buch"]
edition = "2021"

[lib]
name = "carnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
